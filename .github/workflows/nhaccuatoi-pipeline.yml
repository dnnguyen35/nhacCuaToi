name: CI/CD Pipeline nhacCuaToi

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nhaccuatoi-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nhaccuatoi-frontend:latest
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_SOCKET_URL=${{ secrets.REACT_APP_SOCKET_URL }}

      - name: SSH into EC2 and deploy
        id: deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_NHACCUATOI }}
          username: ${{ secrets.EC2_USER_NHACCUATOI }}
          key: ${{ secrets.EC2_KEY_NHACCUATOI }}
          port: 22
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER_NHACCUATOI }}/nhacCuaToi
            {
              sudo docker compose pull
              sudo docker compose down
              sudo docker compose up -d
            } 2>&1 | tee deploy.log

      - name: Copy deploy log from EC2
        if: always()
        run: |
          echo "${{ secrets.EC2_KEY_NHACCUATOI }}" > key.pem
          chmod 600 key.pem
          scp -i key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER_NHACCUATOI }}@${{ secrets.EC2_HOST_NHACCUATOI }}:/home/${{ secrets.EC2_USER_NHACCUATOI }}/nhacCuaToi/deploy.log \
            ./deploy.log || true
          rm -f key.pem

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASS }}
          subject: "[${{ job.status }}] Deployment nhacCuaToi"
          to: "${{ secrets.GMAIL_USER }}"
          from: "nhacCuaToi <${{ secrets.GMAIL_USER }}>"
          html_body: |
            <html>
              <body>
                <h2>Deployment nhacCuaToi</h2>

                <p><b>Status:</b> 
                  <span style="color:${{ job.status == 'success' && 'green' || 'red' }}">
                    ${{ job.status }}
                  </span>
                </p>

                <p><b>Repository:</b> ${{ github.repository }}</p>
                <p><b>Branch:</b> ${{ github.ref }}</p>
                <p><b>Commit:</b> ${{ github.sha }}</p>
                <p><b>Author:</b> ${{ github.actor }}</p>
                <p><b>Run:</b> #${{ github.run_number }}</p>

                <hr>
                <p>Log file attached.</p>
              </body>
            </html>
          attachments: deploy.log
